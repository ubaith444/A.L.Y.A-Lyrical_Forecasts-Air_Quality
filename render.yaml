# Render Infrastructure as Code Blueprint
# Tamil Nadu Climate & Forecast Intelligence Platform — Backend Web Service
services:
  - type: web
    name: tn-climate-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    plan: standard
    disk:
      name: climate-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/climate.db
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
